version: 2
project_name: waldo

before:
  hooks:
    - go mod tidy
    - go test ./...
    # The helper binary, built for every platform a target might run, and
    # shipped inside every archive. waldo looks for these beside its own binary,
    # so an operator on macOS can use the agent tier against a Linux target
    # without a Go toolchain — and waldo never has to download an executable at
    # run time to put on someone else's machine.
    - mkdir -p dist/helpers
    - >-
      env GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath
      -ldflags "-s -w -X main.version={{.Version}}"
      -o dist/helpers/waldo-helper-linux-amd64 ./cmd/waldo-helper
    - >-
      env GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath
      -ldflags "-s -w -X main.version={{.Version}}"
      -o dist/helpers/waldo-helper-linux-arm64 ./cmd/waldo-helper
    - >-
      env GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath
      -ldflags "-s -w -X main.version={{.Version}}"
      -o dist/helpers/waldo-helper-darwin-amd64 ./cmd/waldo-helper
    - >-
      env GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath
      -ldflags "-s -w -X main.version={{.Version}}"
      -o dist/helpers/waldo-helper-darwin-arm64 ./cmd/waldo-helper

builds:
  - id: waldo
    main: ./cmd/waldo
    binary: waldo
    env: [CGO_ENABLED=0]
    # waldo runs on the operator's machine, not the target, so these are the
    # platforms a developer drives agents from. The *target* platforms are a
    # different and wider set — see the agent builds above, which ship inside
    # every archive including the Windows ones, because a Windows operator's
    # target is a POSIX host.
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
        -X main.buildVersion={{.Version}}
        -X main.buildCommit={{.ShortCommit}}
        -X main.buildDate={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - formats: [tar.gz]
    # Windows gets a zip: tar.gz needs a tool that is not on a stock Windows,
    # and an archive an operator cannot open is not a release.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - docs/**/*
      - src: dist/helpers/*
        dst: .
        info: { mode: 0755 }

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:', Merge pull request]

release:
  footer: |
    ## Verifying this release

    Every archive ships `waldo` plus the helper binary for each target platform.
    Check them against `checksums.txt`:

    ```console
    sha256sum -c checksums.txt --ignore-missing
    ```
