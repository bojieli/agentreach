<text x="534" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0550ae" text-anchor="start">one round trip on the connection reach already has</text>
