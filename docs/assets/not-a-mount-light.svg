<text x="532" y="331" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#116329" text-anchor="start">model can read, retry or route around.</text>
<text x="532" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#116329" text-anchor="start">Nothing is mounted, no kernel is involved,</text>
<text x="532" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#116329" text-anchor="start">and `mount` lists nothing new on either side.</text>
