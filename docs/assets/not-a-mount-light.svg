<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-label="A mount versus a request. An SSHFS or FUSE mount turns every tool call into a stream of syscalls through the kernel&#x27;s VFS and a FUSE daemon, so a stalled link parks the agent in uninterruptible sleep with no error it can see. reach answers each tool call with one request and one response over an ssh connection, so a timeout comes back as a tool error the model can read, retry or route around.">
