<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" role="img" aria-label="AgentReach architecture: the coding agent runs on your machine and reach intercepts its Bash, Read, Write and Edit calls before they touch the local disk, running them over one ssh connection on the target instead. The agent, its API key and the conversation never leave your machine; the target needs nothing but the sshd it already runs.">
