name: Bug report
description: Something reach does is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `reach doctor`
      description: |
        This reports the target's userland, which tiers it qualifies for, and
        anything reach has installed there. Targets differ in exactly the
        utilities file operations depend on, so this usually explains a
        surprising failure on its own.
      render: console
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: reach version
      placeholder: reach version
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Which file-operation tier
      description: Shown by `reach status`. If the bug only appears on one tier, that is a strong clue.
      options: [posix, pipe, helper, "not sure"]

  - type: markdown
    attributes:
      value: |
        **If reach read or wrote a file on the wrong machine**, please say so in
        the title. Silent wrong-target file access is the failure this project
        is built to make impossible, and those reports are handled first.
