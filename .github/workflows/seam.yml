name: Seam

# Verify that every supported harness version routes its shell tool calls
# through reach to the remote target, rather than running them locally.
#
# Each harness probe does a full behavioural observation: it drives one real
# (but mock-model-backed) turn, captures the hostname from the tool output, and
# compares it to the session target's hostname. A local hostname is a bypass —
# the seam is broken and reach cannot protect the operator.
#
# Why a separate job from CI:
#   - CI's unit tests catch code regressions; this catches harness regressions —
#     a new release of codex, kimi, or gemini that silently changes how it
#     resolves its shell. It catches reach's own regressions too: every failure
#     this job has ever reported turned out to be reach disarming its own seam,
#     not a harness defeating it.
#   - Docker is required for the sshd container; Docker is available on
#     ubuntu-latest but not reliably on macos-latest.
#   - Installing multiple npm harness versions is slow (~2 min) and should not
#     gate every push; a scheduled weekly run plus pushes to main is enough.

on:
  push:
    branches: [main]
    # Only run when something that might affect a harness seam changed.
    paths:
      - 'cmd/reach/**'
      - 'internal/harnessprobe/**'
      - 'internal/envelope/**'
      - 'test/e2e/**'
      - '.github/workflows/seam.yml'
  schedule:
    # Weekly: Monday 06:00 UTC. Catches new harness releases that break the seam
    # even when no reach code changed.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      codex_versions:
        description: 'Space-separated codex versions to probe (overrides defaults)'
        required: false
      kimi_versions:
        description: 'Space-separated kimi versions to probe (overrides defaults)'
        required: false
      gemini_versions:
        description: 'Space-separated gemini versions to probe (overrides defaults)'
        required: false

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  # Default pinned versions. Add entries here when a new known-good or
  # known-bypassing version is discovered. Each version gets a `bin/<harness>`
  # wrapper in REACH_HARNESS_VERSIONS_DIR so seam_test.sh probes it by label.
  #
  # Format: space-separated semver strings.
  #
  # codex 0.148 was where codex stopped resolving its shell by name, which no
  # PATH shim can intercept. The same release gained environments.toml, and
  # reach routes codex through `reach exec-server` there instead — so 0.148 is
  # the first version of the seam that replaced the shim, not a version that
  # defeats it. This job asserted the opposite for as long as it existed, and
  # nobody saw it, because the probe could not run codex at all.
  #
  # 0.1.0 and 0.147.5 were pinned here too and have since been unpublished from
  # npm; the install step skipped them with a warning every run. Two versions
  # that exist and are verified are worth more than three that are not.
  DEFAULT_CODEX_VERSIONS:  '0.148.0 0.149.0'
  # kimi resolves its shell by absolute path in both of these. reach's managed
  # patched binary honours KIMI_SHELL_PATH, which is what the patch step below
  # applies and what this probes.
  DEFAULT_KIMI_VERSIONS:   '0.36.0 0.37.2'
  # gemini: PATH shim; add newer versions as they are released.
  DEFAULT_GEMINI_VERSIONS: '0.1.9'

jobs:
  seam:
    name: seam probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build reach
        run: go build -o reach ./cmd/reach

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # ── Install pinned harness versions ──────────────────────────────────
      # Each harness is installed into an isolated npm prefix so the binaries
      # from different versions do not shadow each other. The layout matches
      # what seam_test.sh expects:
      #
      #   $VERSIONS_DIR/<harness>/<version>/bin/<harness>
      #
      # For npm packages the bin wrapper is a small shell script that sets
      # NODE_PATH to the version-specific prefix so the right package loads.

      - name: install codex versions
        env:
          CODEX_VERSIONS: ${{ inputs.codex_versions || env.DEFAULT_CODEX_VERSIONS }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/harness-versions/codex"
          for ver in $CODEX_VERSIONS; do
            echo "::group::codex $ver"
            prefix="${dir}/${ver}"
            mkdir -p "${prefix}/bin"
            # Install into an isolated prefix so packages do not conflict.
            npm install --prefix "${prefix}/npm" "@openai/codex@${ver}" 2>&1 || {
              echo "::warning::codex ${ver} not found on npm — skipping"
              rmdir "${prefix}/bin" "${prefix}" 2>/dev/null || true
              echo "::endgroup::"
              continue
            }
            bin="${prefix}/npm/node_modules/.bin/codex"
            if [[ ! -x "$bin" ]]; then
              # Older codex used a different bin name.
              bin="$(find "${prefix}/npm/node_modules/.bin" -name 'codex*' -type f | head -1)"
            fi
            # Write a thin wrapper so the binary is at the expected path.
            cat > "${prefix}/bin/codex" <<SH
          #!/usr/bin/env bash
          exec "${bin}" "\$@"
          SH
            chmod +x "${prefix}/bin/codex"
            echo "codex ${ver}: ${prefix}/bin/codex -> ${bin}"
            echo "::endgroup::"
          done

      - name: install and patch kimi versions
        env:
          KIMI_VERSIONS: ${{ inputs.kimi_versions || env.DEFAULT_KIMI_VERSIONS }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/harness-versions/kimi"
          for ver in $KIMI_VERSIONS; do
            echo "::group::kimi $ver"
            prefix="${dir}/${ver}"
            mkdir -p "${prefix}/bin"
            npm install --prefix "${prefix}/npm" "@moonshot-ai/kimi-code@${ver}" 2>&1 || {
              echo "::warning::kimi ${ver} not found on npm — skipping"
              rmdir "${prefix}/bin" "${prefix}" 2>/dev/null || true
              echo "::endgroup::"
              continue
            }
            # Apply the KIMI_SHELL_PATH patch.  The patch script errors out if
            # the bundle layout changed (new version needs a re-derived patch).
            bundle="${prefix}/npm/node_modules/@moonshot-ai/kimi-code/dist/main.mjs"
            if [[ -f "$bundle" ]]; then
              node contrib/kimi-shell-path-patch.mjs "$bundle" || {
                echo "::warning::kimi ${ver}: patch failed — bundle layout changed; probe will run unpatched"
              }
            else
              echo "::warning::kimi ${ver}: bundle not found at expected path ${bundle}"
            fi
            bin="${prefix}/npm/node_modules/.bin/kimi"
            cat > "${prefix}/bin/kimi" <<SH
          #!/usr/bin/env bash
          exec "${bin}" "\$@"
          SH
            chmod +x "${prefix}/bin/kimi"
            echo "kimi ${ver}: ${prefix}/bin/kimi -> ${bin}"
            echo "::endgroup::"
          done

      - name: install gemini versions
        env:
          GEMINI_VERSIONS: ${{ inputs.gemini_versions || env.DEFAULT_GEMINI_VERSIONS }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/harness-versions/gemini"
          for ver in $GEMINI_VERSIONS; do
            echo "::group::gemini $ver"
            prefix="${dir}/${ver}"
            mkdir -p "${prefix}/bin"
            npm install --prefix "${prefix}/npm" "@google/gemini-cli@${ver}" 2>&1 || {
              echo "::warning::gemini ${ver} not found on npm — skipping"
              rmdir "${prefix}/bin" "${prefix}" 2>/dev/null || true
              echo "::endgroup::"
              continue
            }
            bin="${prefix}/npm/node_modules/.bin/gemini"
            cat > "${prefix}/bin/gemini" <<SH
          #!/usr/bin/env bash
          exec "${bin}" "\$@"
          SH
            chmod +x "${prefix}/bin/gemini"
            echo "gemini ${ver}: ${prefix}/bin/gemini -> ${bin}"
            echo "::endgroup::"
          done

      # ── Run the seam probe ───────────────────────────────────────────────

      - name: run seam_test.sh
        env:
          REACH_BIN: ${{ github.workspace }}/reach
          REACH_HARNESS_VERSIONS_DIR: ${{ runner.temp }}/harness-versions
          REACH_E2E_DIR: ${{ runner.temp }}/reach-e2e
          REACH_E2E_SSH_PORT: '22222'
        run: |
          set -euo pipefail
          bash test/e2e/seam_test.sh 2>&1 | tee "${RUNNER_TEMP}/seam-results.txt"

      - name: job summary
        if: always()
        run: |
          {
            echo "## Seam probe results"
            echo ""
            echo '```'
            cat "${RUNNER_TEMP}/seam-results.txt" 2>/dev/null || echo "(no results)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload result logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seam-probe-logs
          path: ${{ runner.temp }}/reach-e2e/seam-results/
          if-no-files-found: ignore
