name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Keyless signing: cosign trades this workflow's OIDC token for a short-lived
  # certificate, so a signature is bound to this repository, this tag and this
  # workflow file. There is no private key to keep secret, leak or rotate.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: '1.25', cache: true }
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
