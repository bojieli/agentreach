name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.25'

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Three platforms, for two different reasons.
        #
        # Linux and macOS differ in the target's userland: GNU and BSD coreutils
        # disagree on exactly the utilities file operations depend on, and
        # `chmod 700 -- path` worked under one and failed under the other.
        #
        # Windows is here because waldo runs *on* it. Its differences are not
        # cosmetic — the search path is spelled `Path`, and there is no execute
        # bit — and both failed silently in ways that end with an agent running
        # commands on the operator's own machine. Those assertions only mean
        # something when they execute on Windows.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # The race detector needs a C toolchain and is markedly slower on Windows;
      # the concurrency it guards (the handler client, the mirror) is
      # platform-independent and covered on the other two runners.
      - name: test
        shell: bash
        run: |
          race=-race
          [ "$RUNNER_OS" = "Windows" ] && race=
          go test $race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - run: go build ./cmd/...
      - name: coverage summary
        shell: bash
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Exercises every file-operation tier against a real OpenSSH server, which
      # is the only way to cover ssh's second round of shell interpretation, its
      # use of exit 255 for its own failures, and whether the link is 8-bit
      # clean, which decides whether content is base64-framed. The suite
      # starts an sshd owned by the runner user, so this needs no container and
      # no network — and it runs on both userlands rather than only on Linux.
      - name: install openssh-server (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: go test -race -count=1 -tags integration ./test/integration/...

  windows-cli:
    name: windows cli surface
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The unit tests cover the shim and PATH machinery. This covers the thing
      # a Windows operator meets before any of that: does the binary run, does
      # it report itself honestly, and does it fail with an explanation rather
      # than a stack trace when pointed somewhere it cannot reach?
      - name: build
        run: go build -o waldo.exe ./cmd/waldo
      - name: version and help
        shell: bash
        run: |
          set -euo pipefail
          ./waldo.exe version | tee version.txt
          grep -qi 'windows/' version.txt
          ./waldo.exe help | grep -q 'teleoperation'
      - name: an unreachable target fails with an explanation
        shell: bash
        run: |
          set -uo pipefail
          export WALDO_HOME="$RUNNER_TEMP/waldo-home"
          # BatchMode plus a host that does not exist: this must be a clear
          # error, not a hang and not a panic.
          #
          # `set +e` here is not redundant with the line above. The runner
          # invokes this shell with -e already, which `set -uo pipefail` does
          # not undo, so the non-zero exit being asserted ended the step at this
          # command and none of the assertions below it had ever run.
          set +e
          ./waldo.exe up ssh://waldo-nonexistent.invalid/tmp/x --name smoke > out.txt 2>&1
          status=$?
          set -e
          cat out.txt
          test $status -ne 0
          grep -qi 'cannot use' out.txt
      - name: status with no sessions is not an error
        shell: bash
        run: |
          set -euo pipefail
          export WALDO_HOME="$RUNNER_TEMP/waldo-home-empty"
          ./waldo.exe status | grep -qi 'no waldo sessions'

  handler:
    name: python handler (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The tier-2 handler is embedded in the binary and only ever executed on
        # a target, so a syntax error in it would surface as a failing tier on
        # somebody else's server rather than as a build failure here. Targets
        # run whatever python3 they have, which is often an old one.
        python: ['3.8', '3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile internal/fileops/handler.py

  fuzz:
    name: fuzz parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Short runs on every pull request: enough to catch a parser regression
      # while it is still cheap to fix, not enough to find something deep. These
      # both parse input waldo does not control — the agent's framing, and a
      # closed harness's command envelope — in a process holding the operator's
      # credentials.
      - name: fuzz
        run: |
          set -euo pipefail
          go test -run xxx -fuzz FuzzReadFrame       -fuzztime=60s ./cmd/waldo-helper/
          go test -run xxx -fuzz FuzzParseClaudeCode -fuzztime=60s ./internal/envelope/
      - name: keep any crasher found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: |
            cmd/waldo-helper/testdata/fuzz/**
            internal/envelope/testdata/fuzz/**

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  crosscompile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: { go-version: '1.25', cache: true }
      # The helper is built for every platform a *target* might run, which is a
      # wider set than the platforms waldo itself is released for.
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build ./cmd/...

  release-dryrun:
    # The release config was broken and nothing noticed, because a tag was the
    # only thing that had ever run it: the before-hooks built into dist/, which
    # goreleaser then refuses to find non-empty, so `git tag` would have been
    # the first indication. Building a snapshot on every push makes the release
    # path as tested as everything else.
    name: release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: '1.25', cache: true }
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          # Signing needs an OIDC token that only a tagged release run has.
          args: release --snapshot --clean --skip=sign
      # A build that succeeds while producing the wrong archive is the failure
      # worth guarding against. goreleaser will happily ship an archive whose
      # `files` globs matched nothing, which is how the helper binaries and half
      # the docs went missing with no error anywhere.
      - name: archives contain what they promise
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            echo "checking $archive"
            contents=$(tar tzf "$archive")
            for want in waldo waldo-helper-linux-amd64 waldo-helper-linux-arm64 \
                        waldo-helper-darwin-amd64 waldo-helper-darwin-arm64 \
                        docs/ARCHITECTURE.md docs/TRANSPORTS.md docs/SECURITY.md \
                        README.md LICENSE; do
              grep -qx "$want" <<<"$contents" || {
                echo "::error::$archive is missing $want"; exit 1; }
            done
          done
          # Every archive gets an SBOM, and it has to be the SPDX the release
          # notes tell people to expect.
          for archive in dist/*.tar.gz dist/*.zip; do
            sbom="$archive.sbom.json"
            [ -f "$sbom" ] || { echo "::error::no SBOM for $archive"; exit 1; }
            grep -q '"spdxVersion"' "$sbom" || {
              echo "::error::$sbom is not SPDX"; exit 1; }
          done
          # The Windows archive carries POSIX helpers on purpose: a Windows
          # operator's target is a POSIX host.
          unzip -l dist/waldo_*_windows_amd64.zip | grep -q waldo-helper-linux-amd64 || {
            echo "::error::the windows archive has no helper for a POSIX target"; exit 1; }
